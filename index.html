<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="color-scheme" content="only light">
  <title>Tiệm Gà Nhà Tui - Game Quản Lý Tiệm Gà Rán</title>
  <meta name="theme-color" content="#fdf3e4">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <!-- iOS: thêm vào Màn hình chính → mở toàn màn như app -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Tiệm Gà">
  <meta name="format-detection" content="telephone=no">
  <!-- Nền tảng chạm cho iOS Safari (đặt ở đây để áp dụng trước mọi CSS khác) -->
  <style id="ios-base">
    html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    html, body { overscroll-behavior: none; }
    body { -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
    button, [role="button"], .tray-item, .customer-card, .fry-pot { touch-action: manipulation; -webkit-user-select: none; user-select: none; }
    input, textarea { font-size: 16px; } /* < 16px: Safari tự phóng to khi gõ */
    button, input, select, textarea { font-family: inherit; } /* Safari không cho nút kế thừa phông → hiện Times */
    .app { min-height: 100vh; min-height: 100dvh; }
  </style>
  <meta name="description" content="Game quản lý tiệm gà rán chạy trên trình duyệt di động: Từ xe đẩy đầu hẻm đến chuỗi gà quốc dân, review GenZ siêu hài hước!">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/styles/variables.css">
  <link rel="stylesheet" href="/src/styles/main.css">
  <link rel="stylesheet" href="/src/styles/kitchen.css">
  <link rel="stylesheet" href="/src/styles/customers.css">
  <link rel="stylesheet" href="/src/styles/share.css">
  <link rel="stylesheet" href="/src/styles/dashboard.css">
</head>
<body>
  <div id="app" class="app">
    <!-- Header bar -->
    <header id="header" class="header"></header>

    <!-- Striped Awning -->
    <div class="awning"></div>

    <!-- Main dynamic game view container -->
    <main id="main-view" class="main-view"></main>
  </div>

  <!-- Global Modal for Summaries, Popups, Share Card -->
  <div id="modal-container" class="modal-overlay" hidden>
    <div id="modal-content" class="modal-card"></div>
  </div>

  <!-- Toast notification system -->
  <div id="toast" class="toast"></div>

  <!-- Hidden canvas for rendering viral share cards -->
  <canvas id="share-canvas" width="1080" height="1350" style="display: none;"></canvas>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
